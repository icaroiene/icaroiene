name: Generate Snake Animation

on:
  schedule:
    # Roda a cada 6 horas para manter a animação atualizada
    - cron: "0 */6 * * *"
  # Permite disparar manualmente pela aba "Actions"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Gerar os SVGs da snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#0A84FF&color_dots=#0D0D0F,#1F3A5F,#12558A,#0A84FF,#64D2FF

      - name: Publicar na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
